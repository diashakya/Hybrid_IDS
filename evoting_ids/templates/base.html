<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>{% block title %}E-Voting IDS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/vote/">E-Voting IDS</a>
      <div class="ms-auto">
        {% if user.is_authenticated %}
          <span class="text-white me-3">{{ user.username }}</span>
          <form method="post" action="/accounts/logout/" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
          </form>
        {% else %}
          <a href="/accounts/login/" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="/accounts/register/" class="btn btn-light btn-sm">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    {% if messages %}
      {% for msg in messages %}
      <div class="alert {% if msg.tags == 'error' %}alert-danger{% else %}alert-{{ msg.tags }}{% endif %}
        alert-dismissible fade show">
        <!-- <div class="alert alert-{{ msg.tags }} alert-dismissible fade show"> -->
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
{% block content %}{% endblock %}
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
