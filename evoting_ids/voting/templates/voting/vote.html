{% extends "base.html" %}
  {% block title %}Cast Vote — {{ election.title }}{% endblock %}
  {% block content %}
  <h2>{{ election.title }}</h2>
  <p class="text-muted">Select one candidate and submit your vote.</p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    {% for candidate in candidates %}
      <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="candidate"
               id="c{{ candidate.pk }}" value="{{ candidate.pk }}" required>
        <label class="form-check-label" for="c{{ candidate.pk }}">
          <strong>{{ candidate.name }}</strong>
          {% if candidate.description %} — {{ candidate.description }}{% endif %}
        </label>
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-success mt-3">Submit Vote</button>
  </form>
{% endblock %}
